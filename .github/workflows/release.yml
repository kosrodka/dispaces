name: Release

# Build, test and publish a release with a checksum. Start it either by pushing
# a tag like v0.1.0, or from Actions › Release › Run workflow with a version.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # build provenance (public repos only)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#v}"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: scripts/source-check.sh
      - run: swift test --parallel
      - run: scripts/bundle.sh "${{ steps.v.outputs.version }}"
      - run: scripts/security-check.sh build/SpacesBar.app

      # Artifact attestations need a public repo (or GitHub Enterprise Cloud).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: build/SpacesBar.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          sha="$(cut -d' ' -f1 build/SpacesBar.zip.sha256)"
          gh release create "$TAG" build/SpacesBar.zip build/SpacesBar.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Dispaces $TAG" \
            --notes "Ad-hoc signed, hardened runtime, no entitlements. SHA-256: \`$sha\`. Built from commit $GITHUB_SHA by run $GITHUB_RUN_ID. Install steps: docs/06-operations.md."
